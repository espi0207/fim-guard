[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fim-guard"
version = "1.0.0"
description = "Monitor de integridad de archivos (FIM) con línea base firmada con HMAC-SHA256"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "espi0207" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.9"]

[project.scripts]
fimguard = "fimguard.__main__:main"

[tool.setuptools]
packages = ["fimguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
